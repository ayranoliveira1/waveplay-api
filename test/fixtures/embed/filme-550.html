    <script>
        // Select Option
        $('.select_language').on('click', function() {
            let target = $(this).data('target');

            if (!$(this).hasClass('active')) {
                $('.select_language').removeClass('active');
                $(this).addClass('active');

                $('.players_select_items').removeClass('visible');
                $('.players_select_items[data-target="' + target + '"]').addClass('visible');
            }
        });

    // Select Video
$('.player_select_item').on('click', function() {
    $('body').append('<div class="player_loading"><div class="spinner-border spinner-border-sm" role="status"></div></div>');

    var $item     = $(this);
    var vidsrcUrl = $item.data('url'); // se tiver, é o Vidsrc

    // Vidsrc: carrega direto como iframe, igual ao player original de iframe
    if (vidsrcUrl) {
        $('.players_select_container').addClass('hidden');
        $('.player_container').addClass('visible');
        
        // SÓ ADICIONA A CAMADA SE AINDA NÃO DISPAROU NESSA SESSÃO (Monetag Direct Link)
       // let overlay = !anuncioFeito ? '<div class="ad_overlay"></div>' : '';

        // Limpa qualquer player anterior e adiciona o iframe
        $(".player_container .infra").html(
        //    overlay +  // Monetag Direct Link
            '<iframe allowfullscreen frameborder="0" src="' + vidsrcUrl + '"></iframe>'
        );

        $('.player_loading').remove();
        return; // não chamar AJAX
    }

    // Player normal via API (fluxo original)
    let video_id = $item.data('id');
    $.ajax({
        url: `${HOME_URL}/api`,
        method: 'POST',
        data: {
            action: 'getPlayer',
            video_id
        },
        success: function(msg) {
            $('.player_loading').remove();
            $('.players_select_container').addClass('hidden');
            $('.player_container').addClass('visible');
            
            // SÓ ADICIONA A CAMADA SE AINDA NÃO DISPAROU NESSA SESSÃO (Monetag Direct Link)
           // let overlay = !anuncioFeito ? '<div class="ad_overlay"></div>' : '';
           // $(".player_container .infra").html(overlay);
            // Monetag Direct Link FIM

            if (msg.data.video_url.includes('.m3u8') || msg.data.video_url.includes('/hls/')) {
                $(".player_container .infra").append('<div id="player"></div>');

                let tracks = '';
                if (msg.data.video_caption_url != null) {
                    tracks = [{
                        kind: "captions",
                        file: msg.data.video_caption_url,
                        label: "Português",
                        default: true
                    }];

                    if (msg.data.video_caption_url == 'tt9177882') {
                        tracks[0].file = '/app/caption/movie/' + msg.data.video_caption_url + '.vtt';
                    }
                }

                jwplayer("player").setup({
                    sources: [{
                        file: msg.data.video_url,
                        type: 'hls'
                    }],
                    tracks: tracks,
                    aspectratio: '16:9',
                    width: '100%',
                    height: '100%',
                    primary: "html5",
                    abouttext: "EmbedApi",
                    autostart: true,
                    repeat: false,
                    mute: false,
                    controls: true,
                    preload: 'auto',
                    captions: {
                        color: "#ffff00",
                        backgroundOpacity: 0
                    },
                    aboutlink: "https://embedplay.vip",
                });
            } else if (msg.data.video_url.includes('.mp4')) {
                $(".player_container .infra").append('<div id="player"></div>');

                let tracks = '';
                if (msg.data.video_caption_url != null) {
                    tracks = [{
                        kind: "captions",
                        file: msg.data.video_caption_url,
                        label: "Português",
                        default: true
                    }];

                    if (msg.data.video_caption_url == 'tt9177882') {
                        tracks[0].file = '/app/caption/movie/' + msg.data.video_caption_url + '.vtt';
                    }
                }

                jwplayer("player").setup({
                    sources: [{
                        file: msg.data.video_url,
                        type: 'mp4',
                    }],
                    tracks: tracks,
                    aspectratio: '16:9',
                    width: '100%',
                    height: '100%',
                    primary: "html5",
                    abouttext: "EmbedApi",
                    autostart: true,
                    preload: 'auto',
                    captions: {
                        color: "#ffff00",
                        backgroundOpacity: 0
                    },
                    aboutlink: "https://embedplay.vip",
                });
            } else {
                $(".player_container .infra").append(
                    '<iframe allowfullscreen frameborder="0" src="' +
                    msg.data.video_url + '"></iframe>'
                );
            }

        },
        error: function(msg) {
            $('.player_loading').remove();

            if (msg.responseJSON) {
                if (data in msg.responseJSON) {
                    produce_native_notify(msg.responseJSON.data.errors, 'error');
                }
            } else {
                produce_native_notify('Houve um erro inesperado.', 'error');
            }
        }
    });
});

            `);
        });

        $(document).on('click', '.embedder_especial_close2', function() {
            $('.embedder_especial.embedder_info_msg').remove();
